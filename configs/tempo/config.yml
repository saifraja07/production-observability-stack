# Tempo 2.x single-binary configuration, local storage.
# OTLP receivers bind to loopback. Expose only behind TLS + authentication.
stream_over_http_enabled: true

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3200
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9097          # non-default to avoid clashing with other components
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 127.0.0.1:4317
        http:
          endpoint: 127.0.0.1:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h          # EXAMPLE: 7 days

storage:
  trace:
    backend: local
    wal:
      path: /var/lib/tempo/wal
    local:
      path: /var/lib/tempo/blocks

usage_report:
  reporting_enabled: false
