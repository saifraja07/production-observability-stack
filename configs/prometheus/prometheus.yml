# Prometheus 3.x example configuration.
# All targets bind to loopback by default. Change only if you understand the exposure.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: example   # CHANGE: e.g. staging / production

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: example-api
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8080"]

  # Host metrics (CPU, memory, disk). Requires node_exporter to be installed separately.
  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["127.0.0.1:3200"]

  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]
