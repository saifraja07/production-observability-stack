# Illustrative alert rules. Thresholds and durations below are EXAMPLES:
# tune them against your own baseline and SLOs before relying on them.
groups:
  - name: example-api
    rules:
      - alert: ExampleApiHighErrorRate
        expr: |
          sum(rate(example_api_http_requests_failed_total[5m]))
            / sum(rate(example_api_http_requests_total[5m])) > 0.05
          and sum(rate(example_api_http_requests_total[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx error ratio"
          description: "More than 5% of requests failed over the last 5 minutes (current: {{ $value | humanizePercentage }})."

      - alert: ExampleApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(example_api_http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 request latency above 1s"
          description: "p95 latency is {{ $value | humanizeDuration }}."

      - alert: ExampleApiDown
        expr: up{job="example-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Example API is not reachable by Prometheus"
          description: "Scrape of {{ $labels.instance }} has failed for 1 minute."

  - name: infrastructure
    rules:
      - alert: HostHighCpuUtilization
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host CPU utilization above 85%"
          description: "CPU utilization is {{ $value | printf \"%.1f\" }}%. Requires node_exporter."

      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Scrape target down: {{ $labels.job }}"
          description: "Target {{ $labels.instance }} (job {{ $labels.job }}) has been down for 2 minutes."
