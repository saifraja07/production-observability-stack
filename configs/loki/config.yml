# Loki 3.x single-binary configuration, local filesystem storage.
# Run with -config.expand-env=true if you enable the optional ${VAR} object-storage block below.
auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /var/lib/loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /var/lib/loki/chunks
      rules_directory: /var/lib/loki/rules
  # --- Optional: S3-compatible object storage (e.g. Cloudflare R2) ---
  # Replace the `filesystem` block above with this, set object_store: s3 in
  # schema_config and delete_request_store: s3 in compactor. Verify against your Loki version.
  # storage:
  #   s3:
  #     endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
  #     bucketnames: ${R2_BUCKET}
  #     access_key_id: ${R2_ACCESS_KEY_ID}
  #     secret_access_key: ${R2_SECRET_ACCESS_KEY}
  #     region: auto
  #     s3forcepathstyle: true

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /var/lib/loki/tsdb-index
    cache_location: /var/lib/loki/tsdb-cache

compactor:
  working_directory: /var/lib/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

limits_config:
  retention_period: 168h            # EXAMPLE: 7 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  volume_enabled: true

analytics:
  reporting_enabled: false
